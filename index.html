<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الحروف الجماعية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="lobby">
    <h1>لعبة الحروف الجماعية</h1>
    <div class="card">
      <h2>إنشاء غرفة</h2>
      <input type="text" id="host-name" placeholder="اسمك">
      <button onclick="createRoom()">إنشاء اللعبة</button>
      <p id="room-created-code"></p>
    </div>

    <div class="card">
      <h2>دخول إلى غرفة</h2>
      <input type="text" id="player-name" placeholder="اسم اللاعب">
      <input type="text" id="room-code-input" placeholder="رمز الغرفة">
      <div class="team-select">
        <button id="btn-red" onclick="selectTeam('red')">الفريق الأحمر</button>
        <button id="btn-green" onclick="selectTeam('green')">الفريق الأخضر</button>
      </div>
      <button onclick="joinRoom()">دخول</button>
    </div>
  </div>

  <div id="game-screen" style="display:none;">
    <div class="game-info">
      <div>غرفة: <span id="display-room-code"></span></div>
      <div class="team-score red-score">الأحمر: <span id="score-red">0</span></div>
      <div class="team-score green-score">الأخضر: <span id="score-green">0</span></div>
    </div>

    <div class="main-game-container">
      <div id="game-grid-wrapper">
        <div class="hex-grid-container" id="grid"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="startNewGame()">بدء اللعبة</button>
      <button onclick="resetBoard()">جولة جديدة</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
